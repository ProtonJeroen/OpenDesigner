name: Build
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libarchive-dev libtbb-dev libfontconfig1-dev tcl-dev tk-dev qt6-base-dev libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev libocct-visualization-dev libocct-data-exchange-dev libocct-ocaf-dev libocct-draw-dev xvfb xauth libgl1-mesa-dri fonts-dejavu-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENDESIGNER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j4
      - name: CTests (X11 and software OpenGL)
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" ctest --test-dir build -C Release --output-on-failure -j2
      - name: Stage Linux executable
        run: |
          mkdir -p dist/OpenDesigner
          cp build/OpenDesigner dist/OpenDesigner/
          cat > dist/OpenDesigner/README.txt <<'EOF'
          OpenDesigner v0.5.5 Advanced Sketch Curves Linux prototype
          This is an unbundled executable, NOT a standalone AppImage.
          Requires compatible Qt 6, Open CASCADE and graphics runtime libraries.
          On Ubuntu 24.04 the build dependencies from .github/workflows/build.yml
          provide the required development/runtime libraries.
          Run: ./OpenDesigner
          EOF
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenDesigner-linux-x86_64-prototype
          path: dist/OpenDesigner/
          if-no-files-found: error
