name: Build
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libtbb-dev libfontconfig1-dev tcl-dev tk-dev qt6-base-dev libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev libocct-visualization-dev libocct-data-exchange-dev libocct-ocaf-dev libocct-draw-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Stage Linux executable
        run: |
          mkdir -p dist/OpenDesigner
          cp build/OpenDesigner dist/OpenDesigner/
          cat > dist/OpenDesigner/README.txt <<'EOF'
          OpenDesigner v0.1.1 Linux prototype
          This is an unbundled executable, NOT a standalone AppImage.
          Requires compatible Qt 6, Open CASCADE and graphics runtime libraries.
          On Ubuntu 24.04 the build dependencies from .github/workflows/build.yml
          provide the required development/runtime libraries.
          Run: ./OpenDesigner
          EOF
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenDesigner-linux-x86_64-prototype
          path: dist/OpenDesigner/
          if-no-files-found: error
